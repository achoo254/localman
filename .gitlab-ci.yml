# GitLab CI for Localman — verify on every push, build Windows on tags
# See docs/env-configuration-guide.md for setup details

stages:
  - verify
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

lint-and-test:
  stage: verify
  image: node:22-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm type-check
    - pnpm test --run
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-windows:
  stage: build
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - .pnpm-store/
    - key:
        files:
          - src-tauri/Cargo.lock
      paths:
        - .cargo/registry/
        - src-tauri/target/
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm tauri build
  artifacts:
    name: "localman-windows-$CI_COMMIT_TAG"
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
